name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main  # Change to 'master' if your main branch is named master

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install dependencies and build the project if a package.json file exists
      - name: Install dependencies (If React/Vite)
        run: |
          if [ -f package.json ]; then
            npm install
            npm run build --if-present
          fi

      # Deploy the build or static files directly to Cloudflare Pages
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=ai-video-conferencing-platform
