name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main  # Change to 'master' if your main branch is named master

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Navigate into the frontend folder, install dependencies, and build the Vite project
      - name: Install and Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      # Deploy the generated dist folder inside frontend to Cloudflare Pages
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pointing to frontend/dist where Vite generates the production build
          command: pages deploy frontend/dist --project-name=ai-video-conferencing-platform-with-real-time-transcrip
